<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pfeil-blau" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="pfeil-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="pfeil-grau" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Weisser Hintergrund, damit die Grafik auch im Dark Mode lesbar ist -->
  <rect width="900" height="500" rx="16" fill="#ffffff"/>

  <!-- ── GitHub ─────────────────────────────── -->
  <rect x="20" y="20" width="860" height="250" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="52" font-size="20" fill="#0f172a"><tspan font-weight="700">GitHub</tspan> – gemeinsam, online</text>

  <!-- main -->
  <line x1="40" y1="100" x2="860" y2="100" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <text x="860" y="132" font-size="16" font-weight="700" fill="#2563eb" text-anchor="end">main</text>
  <text x="860" y="151" font-size="13" fill="#2563eb" text-anchor="end">offizieller Stand</text>

  <!-- Branch -->
  <path d="M250,100 C250,160 290,200 340,200 L620,200 C670,200 720,160 720,100" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
  <text x="345" y="236" font-size="16" font-weight="700" fill="#ea580c">dein Branch</text>

  <!-- Commits -->
  <g stroke-width="4" fill="#ffffff">
    <circle cx="80" cy="100" r="10" stroke="#2563eb"/>
    <circle cx="250" cy="100" r="10" stroke="#2563eb"/>
    <circle cx="720" cy="100" r="12" stroke="#2563eb" fill="#2563eb"/>
    <circle cx="820" cy="100" r="10" stroke="#2563eb"/>
    <circle cx="390" cy="200" r="10" stroke="#ea580c"/>
    <circle cx="480" cy="200" r="10" stroke="#ea580c"/>
    <circle cx="570" cy="200" r="10" stroke="#ea580c"/>
  </g>

  <!-- Schritt-Beschriftungen -->
  <g font-size="15" fill="#0f172a">
    <circle cx="300" cy="150" r="13" fill="#0f172a"/>
    <text x="300" y="155" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="320" y="155">Branch erstellen</text>

    <circle cx="470" cy="148" r="13" fill="#0f172a"/>
    <text x="470" y="153" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text x="490" y="146" font-weight="700">Pull Request</text>
    <text x="490" y="165" font-size="13" fill="#475569">«Bitte übernehmen»</text>

    <circle cx="690" cy="68" r="13" fill="#0f172a"/>
    <text x="690" y="73" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">6</text>
    <text x="710" y="73"><tspan font-weight="700">Merge</tspan> – übernommen</text>
  </g>

  <!-- ── Pfeile zwischen GitHub und Laptop ──── -->
  <line x1="80" y1="116" x2="80" y2="308" stroke="#2563eb" stroke-width="4" marker-end="url(#pfeil-blau)"/>
  <line x1="570" y1="312" x2="570" y2="220" stroke="#ea580c" stroke-width="4" marker-end="url(#pfeil-orange)"/>

  <g font-size="15" fill="#0f172a">
    <circle cx="108" cy="295" r="13" fill="#0f172a"/>
    <text x="108" y="300" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="128" y="300"><tspan font-weight="700">Pull</tspan> – neuesten Stand holen</text>

    <circle cx="598" cy="295" r="13" fill="#0f172a"/>
    <text x="598" y="300" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="618" y="300"><tspan font-weight="700">Push</tspan> – hochladen</text>
  </g>

  <!-- ── Laptop ─────────────────────────────── -->
  <rect x="20" y="320" width="860" height="160" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="352" font-size="20" fill="#0f172a"><tspan font-weight="700">Dein Laptop</tspan> – VS Code</text>

  <circle cx="160" cy="420" r="13" fill="#0f172a"/>
  <text x="160" y="425" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">3</text>

  <g font-size="16" fill="#0f172a" text-anchor="middle">
    <rect x="190" y="385" width="170" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="275" y="416" font-weight="700">Bearbeiten</text>
    <text x="275" y="438" font-size="13" fill="#475569">Text schreiben</text>

    <rect x="400" y="385" width="170" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="485" y="416" font-weight="700">Prüfen</text>
    <text x="485" y="438" font-size="13" fill="#475569">PDF-Vorschau</text>

    <rect x="610" y="385" width="200" height="70" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="710" y="416" font-weight="700">Commit</text>
    <text x="710" y="438" font-size="13" fill="#475569">Zwischenstand speichern</text>
  </g>
  <line x1="362" y1="420" x2="392" y2="420" stroke="#64748b" stroke-width="2.5" marker-end="url(#pfeil-grau)"/>
  <line x1="572" y1="420" x2="602" y2="420" stroke="#64748b" stroke-width="2.5" marker-end="url(#pfeil-grau)"/>
</svg>
